name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Restrict default token permissions across all jobs
permissions:
  contents: read

jobs: 
  sonarqube:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: Download coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-report
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  checktypes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: checktypes
      - name: Run pyright
        run: uvx --no-build pyright==1.1.409

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Run ruff
        run: uvx --no-build ruff==0.15.12 check .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck {} +

  securitycheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: securitycheck
      - name: Run bandit
        run: uvx --no-build bandit==1.9.4 -c bandit.yaml ./*.py

  pipaudit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: pipaudit
      - name: Run pip-audit
        run: uv export --no-hashes | uvx --no-build --python 3.13 pip-audit==2.10.0 -r /dev/stdin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: test
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev # NOSONAR
      - name: Run tests
        run: uv run --frozen pytest --cov --cov-report=xml # NOSONAR
        env:
          TEST_CYLERA_BASE_URL: ${{ secrets.TEST_CYLERA_BASE_URL }}
          TEST_CYLERA_USERNAME: ${{ secrets.TEST_CYLERA_USERNAME }}
          TEST_CYLERA_PASSWORD: ${{ secrets.TEST_CYLERA_PASSWORD }}
          TEST_SWITCH_CYLERA_BASE_URL: ${{ secrets.TEST_SWITCH_CYLERA_BASE_URL }}
          TEST_SWITCH_CYLERA_USERNAME: ${{ secrets.TEST_SWITCH_CYLERA_USERNAME }}
          TEST_SWITCH_CYLERA_PASSWORD: ${{ secrets.TEST_SWITCH_CYLERA_PASSWORD }}
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 
        with:
          name: coverage-report
          path: coverage.xml
